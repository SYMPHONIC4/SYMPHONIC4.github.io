<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบบันทึกข้อมูล กฟภ.</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth-container" class="card">
<h2>เข้าสู่ระบบ</h2>
<input type="text" id="login-username" placeholder="ชื่อผู้ใช้">
<input type="password" id="login-password" placeholder="รหัสผ่าน">
<button onclick="login()">เข้าสู่ระบบ</button>
<p>ยังไม่มีบัญชี? <a href="#" onclick="showSignUp()">สมัครสมาชิก</a></p>
<p><a href="#" onclick="showForgotPassword()">ลืมรหัสผ่าน?</a></p>
</div>


<div id="main-container" class="hidden">
<nav>
<ul>
<li onclick="showSection('form-section')">บันทึกงาน</li>
<li onclick="showSection('records-section')">ข้อมูลการบันทึก</li>
<li onclick="showSection('user-section')">ข้อมูลผู้ใช้</li>
<li onclick="logout()">ออกจากระบบ</li>
</ul>
</nav>


<section id="form-section" class="card">
<h2>ฟอร์มบันทึกข้อมูล</h2>
<input type="text" id="fname" placeholder="ชื่อ">
<input type="text" id="lname" placeholder="นามสกุล">
<input type="text" id="phone" placeholder="เบอร์โทร">
<textarea id="details" placeholder="รายละเอียดเพิ่มเติม"></textarea>
<input type="file" id="image">
<input type="datetime-local" id="datetime">
<input type="text" id="filename" placeholder="ตั้งชื่อไฟล์งาน">
<button onclick="saveRecord()">บันทึกงาน</button>
<button onclick="downloadPDF()">ดาวน์โหลด PDF</button>
<button onclick="window.print()">ปริ้น</button>
</section>


<section id="records-section" class="card hidden">
<h2>ข้อมูลการบันทึก</h2>
<input type="text" id="search" placeholder="ค้นหาชื่อไฟล์งาน" onkeyup="searchRecords()">
<ul id="records-list"></ul>
</section>


<section id="user-section" class="card hidden">
<h2>ข้อมูลผู้ใช้</h2>
<p id="user-info"></p>
</section>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
